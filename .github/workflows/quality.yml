name: Quality checks

on:
  push:
    branches: [release, "quality/**"]
  pull_request:
    branches: [release]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build production app
        run: npm run build
