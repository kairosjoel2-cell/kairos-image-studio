<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="description" content="KAIROS Image Studio — professional, offline-first graphic design and advanced image editing in the browser." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>KAIROS Image Studio</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <style>
      /* ============================================================
         KAIROS DESIGN SYSTEM — professional black & red
         ============================================================ */
      :root {
        --k-bg: #0a0a0b;
        --k-bg-2: #111113;
        --k-panel: #17171a;
        --k-panel-2: #1d1d21;
        --k-border: #2a2a30;
        --k-border-2: #3a3a42;
        --k-text: #ececf1;
        --k-text-dim: #9a9aa5;
        --k-text-faint: #6a6a75;
        --k-red: #e5484d;
        --k-red-hover: #f0565c;
        --k-red-dim: rgba(229, 72, 77, 0.14);
        --k-red-deep: #b3282d;
        --k-focus: #ff6b70;
        --k-ok: #4cc38a;
        --k-warn: #f5a623;
        --k-radius: 10px;
        --k-radius-sm: 6px;
        --k-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
        --k-font: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        --k-mono: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body { height: 100%; overscroll-behavior: none; }

      body {
        background: var(--k-bg);
        color: var(--k-text);
        font-family: var(--k-font);
        font-size: 14px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        overflow: hidden;
      }

      #root { height: 100%; }

      ::selection { background: rgba(229, 72, 77, 0.35); }

      /* Scrollbars */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: var(--k-bg-2); }
      ::-webkit-scrollbar-thumb { background: var(--k-border-2); border-radius: 5px; border: 2px solid var(--k-bg-2); }
      ::-webkit-scrollbar-thumb:hover { background: var(--k-red-deep); }

      /* Focus visibility */
      :focus-visible { outline: 2px solid var(--k-focus); outline-offset: 2px; }

      button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

      /* Boot splash — shown until React mounts */
      #kairos-boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 18px; background: var(--k-bg); z-index: 9999;
        transition: opacity 0.35s ease;
      }
      #kairos-boot.hidden { opacity: 0; pointer-events: none; }
      .kairos-boot-logo {
        font-size: 40px; font-weight: 800; letter-spacing: 0.32em; text-transform: uppercase;
        color: var(--k-text); text-indent: 0.32em;
      }
      .kairos-boot-logo span { color: var(--k-red); }
      .kairos-boot-sub { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--k-text-dim); }
      .kairos-boot-bar { width: 220px; height: 3px; background: var(--k-border); border-radius: 2px; overflow: hidden; }
      .kairos-boot-bar::after {
        content: ''; display: block; height: 100%; width: 40%; background: var(--k-red);
        border-radius: 2px; animation: kairos-boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes kairos-boot-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

      @media (prefers-reduced-motion: reduce) {
        .kairos-boot-bar::after { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="kairos-boot" aria-hidden="true">
      <div class="kairos-boot-logo">KAIROS<span>.</span></div>
      <div class="kairos-boot-sub">Image Studio</div>
      <div class="kairos-boot-bar"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
